# nginx of the local deployment: the pages of the frontend, and /api passed on to the backend, so the browser sees
# one origin, as with the dev server. See Deployment in docs/backend/backend-design.md.
server {
    listen 80;
    root /usr/share/nginx/html;

    # A little above the image limit of 2 MB, as in the backend, so the backend answers IMAGE_TOO_LARGE itself.
    client_max_body_size 3m;

    # The client address. nginx sets the header to the address of the connection and never passes on one the
    # client sent, so a client cannot choose the address that the login counts (Login security in the database
    # design). The backend trusts this header only from a private address, such as this container.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The event stream of one signed-in device must reach the page at once, so it is not buffered, and it stays
    # open up to 15 minutes, with a comment every 25 seconds.
    location = /api/v1/auth/session-events {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 20m;
    }

    # Every other path is a page of the application, which the frontend routes itself.
    location / {
        try_files $uri /index.html;
    }
}

# Runs every test of the backend on a clean machine, on each push to any branch.
# The integration tests start their own MySQL 8.4 container, so the job needs no database, no account,
# and no secret. See Continuous integration in docs/backend/backend-design.md.
name: Backend tests

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # The wrapper is stored without the executable bit.
      - name: Run the tests
        run: sh ./mvnw --batch-mode test

spring:
  application:
    name: opsflow-backend
  # A little above the image limit, so that a larger upload is refused before it is read, and answered IMAGE_TOO_LARGE.
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/opsflow?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=utf8
    username: ${OPSFLOW_DB_USERNAME}
    password: ${OPSFLOW_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    user: ${OPSFLOW_MIGRATION_USERNAME}
    password: ${OPSFLOW_MIGRATION_PASSWORD}
  # Redis keeps the login counts of each client address (see Login security in the database design). The
  # timeouts are short: when Redis does not answer, the login goes on without those limits.
  data:
    redis:
      host: ${OPSFLOW_REDIS_HOST:127.0.0.1}
      port: ${OPSFLOW_REDIS_PORT:6379}
      password: ${OPSFLOW_REDIS_PASSWORD:}
      timeout: 500ms
      connect-timeout: 500ms
  # RabbitMQ holds the mails until they are sent (see Mail in the backend design). The broker confirms each
  # mail it takes. Without the variables, the default local account of RabbitMQ is used, which RabbitMQ lets
  # in from this machine only.
  rabbitmq:
    host: ${OPSFLOW_RABBITMQ_HOST:127.0.0.1}
    port: ${OPSFLOW_RABBITMQ_PORT:5672}
    username: ${OPSFLOW_RABBITMQ_USERNAME:guest}
    password: ${OPSFLOW_RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: simple
    connection-timeout: 2s

# Actuator answers on a port of its own, which the reverse proxy does not pass on, so the health check and the
# counters are reachable only from the machine or the containers beside it (see Deployment in the backend design).
management:
  server:
    port: ${OPSFLOW_MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health, metrics
  endpoint:
    health:
      probes:
        enabled: true

# Every log line of a request carries the id of the request, set by RequestIdFilter.
logging:
  pattern:
    correlation: "[%X{requestId:-}] "

# Operating parameters (T-11). The reasons are in Operating Parameters in docs/database/database-design.md.
opsflow:
  retry:
    attempts: 3           # in total, the first try included
    delays: 50ms, 150ms   # before the 2nd and the 3rd try; a random extra of up to half is added
  paging:
    page-size: 10         # the default and the most
    product-page-size: 16 # the product page when it asks for no size; the person chooses 8, 16, or 24
    product-page-max: 24  # the most cards a page of the product page may ask for
  login:
    lock-steps:           # failures of one account from one client address: how long that address is locked out of it
      5: 1m
      10: 5m
      15: 15m
    lock-until-midnight-at: 20     # failures of one account from one address that lock that address out until midnight
    reset-zone: Australia/Sydney   # the midnight at which the failure counts start again
    account-failures-per-day: 100  # failures of one account from every address in a day that lock it until midnight
    address-failures: 50           # failures of one client address, on any username, in one window
    address-window: 15m            # the window of address-failures
  email-code:
    ttl: 10m                       # a code is valid this long
    max-wrong-entries: 5           # wrong entries after which a code is dead
    resend-after: 60s              # a new code for the same email and purpose can be requested after this
    requests-per-ip-per-hour: 10   # accepted code requests of one client address in one hour
    requests-per-day: 200          # accepted code requests of the whole system in one day
    day-zone: Australia/Sydney     # the midnight at which the day of requests-per-day starts
    cleanup-interval: 1m           # how often expired codes and old request counts are deleted
    cleanup-batch: 1000            # the most rows one run deletes from each table
  quantity:
    max-stock-input: 999999  # a starting quantity, a stock-in, a write-off, or a correction
    max-order-line: 9999     # one order line
  warehouse:
    # The item images, kept outside the web root. A relative folder is taken from where the application starts.
    image-dir: ${OPSFLOW_IMAGE_DIR:./data/images}
    image-max-bytes: 2097152 # 2 MB
    sku-attempts: 5          # generated SKUs tried before adding an item fails
  order:
    max-lines: 20            # product lines in one order; the product page sends one
    number-attempts: 5       # generated order numbers tried before an order fails on a clash
  ticket:
    number-attempts: 5          # generated ticket numbers tried before opening a ticket fails on a clash
    max-open-created: 99        # OPEN tickets one person may have created
    max-in-progress: 99         # IN_PROGRESS tickets one person may hold
    max-items: 20               # warehouse items one ticket may link
    max-archive-batch: 100      # tickets one batch archive may name
    auto-archive-after: 7d      # a RESOLVED ticket is archived by the job this long after resolved_at
    auto-archive-at-resolved: 99 # at this many RESOLVED tickets the job archives all of them
    archive-interval: 1m        # how often the archive job runs
    archive-job-batch: 500      # the most tickets one run of the job archives; the next run takes the rest
  time-filter:
    zone: Australia/Sydney   # the days a person picks in a time filter are days of this zone
  jobs:
    enabled: true         # the scheduled jobs run; the tests turn them off and call them directly
  # The mail server (SMTP with STARTTLS). Without a host or a password no mail is sent and a warning is logged, so
  # the application starts on a machine that has no mail account. The password is a secret.
  mail:
    host: ${OPSFLOW_MAIL_HOST:}
    port: ${OPSFLOW_MAIL_PORT:587}
    username: ${OPSFLOW_MAIL_USERNAME:}
    password: ${OPSFLOW_MAIL_PASSWORD:}
    from: ${OPSFLOW_MAIL_FROM:}    # the sender address; the username when empty
    queue-ttl: 10m                 # a mail expires in the mail queue after this, like the code it holds
  token:
    ttl: 12h              # a login token lasts this long; there is no refresh token
  # The key that signs the login tokens: Base64 of at least 32 random bytes. It is a secret, so it
  # comes from the environment and has no default.
  token-signing-key: ${OPSFLOW_TOKEN_SIGNING_KEY}

# The API documentation (see API documentation in the backend design): the OpenAPI description and Swagger UI,
# under the base path so the reverse proxy passes them on. Only the controllers of the application are described.
springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /api/v1/docs
    operations-sorter: alpha
    tags-sorter: alpha
  packages-to-scan: com.opsflow
